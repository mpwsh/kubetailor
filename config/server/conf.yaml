server:
  logLevel: debug
  addr: 0.0.0.0
  port: 8080
quickwit:
  apiVersion: v1
  url: "http://192.168.1.215:7280"
  index: otel-logs-v0_7
garage:
  url: "http://garage.garage.svc.cluster.local:7280"
  keys:
    maxPerUser: 10
  buckets:
    maxPerUser: 10
    quotas:
      # Per bucket, in Mib
      maxSize: 512
      maxObjects: 5000
kubetailor:
  namespace: kubetailor
  gitSync:
    image: registry.k8s.io/git-sync/git-sync:v3.6.6
    period: 30s
  deployment:
    annotations:
      reloader.stakater.com/auto: "true"
    # Limit connectivity to:
    # - internet
    # - pods owned by the same (owner) deployer
    # - pods on the same Group
    deployNetworkPolicies: true
    serviceAccount: limited
    # enable to list services in the same namespace as env vars.
    enableServiceLinks: false
    allowPrivilegeEscalation: true
    allowRoot: true
    architectures: ["amd64", "arm64"]
    allowedImages:
      - nginx
      - postgres
      - mkodockx/docker-pastebin
      - node
      - nicolaka/netshoot
      - tsl0922/ttyd:latest
    # Bounds on what one app may ask for, as Kubernetes quantities. The minimums are also the
    # defaults: an app that names no size gets them, so every pod carries requests and a full
    # node is a known thing (that is what lets the cluster grow on demand).
    resources:
      cpu:
        min: 200m
        max: 1
      memory:
        min: 128Mi
        max: 2Gi
      volume:
        count:
          max: 2
        size:
          min: 100Mi
          # Volumes live on the app's node; keep them small so one app cannot fill it.
          max: 2Gi
    replicas:
      min: 1
      max: 3
  # Regions apps may be pinned to, as the console offers them: the node label value and the
  # name people see. Empty: whatever regions the cluster's nodes carry, named by their id.
  regions:
    - id: scl
      name: Santiago
    - id: sao
      name: São Paulo
    - id: waw
      name: Warsaw
  ingress:
    baseDomain: mpw.sh
    loadBalancerEndpoint: k3s.mpw.sh
    className: nginx
    matchLabels:
      app.kubernetes.io/name: ingress-nginx
    # Add these annotations to all created ingresses
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/affinity: cookie
      nginx.ingress.kubernetes.io/enable-cors: "true"
      nginx.ingress.kubernetes.io/proxy-body-size: "8096"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
      nginx.ingress.kubernetes.io/session-cookie-expires: "172800"
      nginx.ingress.kubernetes.io/session-cookie-max-age: "172800"
      nginx.ingress.kubernetes.io/session-cookie-name: route
