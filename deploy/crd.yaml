apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tailoredapps.kubetailor.io
spec:
  group: kubetailor.io
  names:
    kind: TailoredApp
    plural: tailoredapps
    singular: tailoredapp
    shortNames:
      - tapp
      - tapps
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                labels:
                  type: object
                  additionalProperties:
                    type: string
                deployment:
                  type: object
                  properties:
                    annotations:
                      type: object
                      additionalProperties:
                        type: string
                    serviceAccount:
                      type: string
                    enableServiceLinks:
                      type: boolean
                    allowRoot:
                      type: boolean
                    runAsUser:
                      type: number
                    runAsGroup:
                      type: number
                    deployNetworkPolicies:
                      type: boolean
                    allowPrivilegeEscalation:
                      type: boolean
                    region:
                      description: Region the app must run in (topology.kubernetes.io/region node label).
                      type: string
                    container:
                      type: object
                      properties:
                        image:
                          type: string
                        port:
                          description: HTTP port the ingress routes to. Optional when `ports` is set.
                          type: integer
                        ports:
                          description: Additional ports with their own protocol and exposure.
                          type: array
                          items:
                            type: object
                            required: ["port"]
                            properties:
                              port:
                                type: integer
                                minimum: 1
                                maximum: 65535
                              protocol:
                                type: string
                                enum: ["TCP", "UDP"]
                                default: TCP
                              expose:
                                description: cluster (Service only), node (hostPort on the pod's node), nodePort (NodePort Service, externalTrafficPolicy Local).
                                type: string
                                enum: ["cluster", "node", "nodePort"]
                                default: cluster
                              name:
                                type: string
                        replicas:
                          type: integer
                        buildCommand:
                          type: string
                        runCommand:
                          type: string
                        volumes:
                          type: object
                          additionalProperties:
                            type: string
                        files:
                          type: object
                          additionalProperties:
                            type: string
                git:
                  type: object
                  properties:
                    image:
                      type: string
                    period:
                      type: string
                    repository:
                      type: string
                    branch:
                      type: string
                    username:
                      type: string
                    token:
                      type: string
                    root:
                      type: string
                    dest:
                      type: string
                ingress:
                  type: object
                  properties:
                    className:
                      type: string
                    annotations:
                      type: object
                      additionalProperties:
                        type: string
                    matchLabels:
                      type: object
                      additionalProperties:
                        type: string
                    domains:
                      type: object
                      properties:
                        shared:
                          type: string
                        custom:
                          type: string
                env:
                  type: object
                  additionalProperties:
                    type: string
                secrets:
                  type: object
                  additionalProperties:
                    type: string
              required: ["labels", "deployment"]
            status:
              type: object
              properties:
                observedGeneration:
                  description: metadata.generation the operator last applied.
                  type: integer
                nodes:
                  description: Nodes running the app, with their public IPs.
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      ip:
                        type: string
                      region:
                        type: string
                endpoints:
                  description: Addresses clients use for ports exposed at the node.
                  type: array
                  items:
                    type: object
                    properties:
                      ip:
                        type: string
                      port:
                        type: integer
                      protocol:
                        type: string
                message:
                  type: string
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Owner
          type: string
          description: Tapp Owner
          jsonPath: .metadata.labels.owner
        - name: Group
          type: string
          description: Tapp Group
          jsonPath: .metadata.labels.group
        - name: Image
          type: string
          description: Container image
          jsonPath: .spec.deployment.container.image
        - name: Port
          type: string
          description: Container Port
          jsonPath: .spec.deployment.container.port
        - name: Region
          type: string
          description: Requested region
          jsonPath: .spec.deployment.region
        - name: Node IP
          type: string
          description: Public IP of the node running the app
          jsonPath: .status.nodes[0].ip
        - name: Ingress Class
          type: string
          description: Ingress Class
          jsonPath: .spec.ingress.className
        - name: Shared Domain
          type: string
          description: Shared domain for the TailoredApp
          jsonPath: .spec.ingress.domains.shared
        - name: Custom Domain
          type: string
          description: Custom domain for the TailoredApp
          jsonPath: .spec.ingress.domains.custom
