kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: kubetailor
rules:
- apiGroups:
  - kubetailor.io
  resources:
  - tailoredapps
  - tailoredapps/status
  verbs:
  - create
  - get
  - watch
  - list
  - patch
  - delete
  - update
  - deletecollection
# Placement: which node runs an app's pods and what that node's public IP is.
- apiGroups:
  - ""
  resources:
  - nodes
  - pods
  verbs:
  - get
  - list
  - watch
# Nodes and ports through the flint controller: a NodeClaim per region (or per node the
# scheduler says is missing), a FirewallRule per port exposed at the node. Not needed on a
# cluster without flint; the operator notices and skips both.
- apiGroups:
  - flint.mpw.sh
  resources:
  - nodeclaims
  verbs:
  - get
  - list
  - watch
  - create
  - patch
  - delete
- apiGroups:
  - flint.mpw.sh
  resources:
  - firewallrules
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
  - deletecollection
- apiGroups:
  - networking.k8s.io
  resources:
  - ingresses
  - networkpolicies
  verbs:
  - get
  - create
  - watch
  - list
  - create
  - update
  - patch
  - delete
  - deletecollection
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - watch
  - list
  - create
  - update
  - patch
  - delete
  - deletecollection
- apiGroups:
  - ""
  resources:
  - secrets
  - configmaps
  - services
  - persistentvolumeclaims
  - persistentvolumes
  verbs:
  - get
  - watch
  - list
  - create
  - update
  - patch
  - delete
  - deletecollection
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubetailor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubetailor
subjects:
- kind: ServiceAccount
  name: kubetailor
  namespace: kubetailor
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubetailor
  namespace: kubetailor
